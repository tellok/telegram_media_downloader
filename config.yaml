api_hash: your_api_hash
api_id: your_api_id
chat:
- chat_id: telegram_chat_id
  last_read_message_id: 0
file_formats:
  audio:
  - all
  document:
  - all
  video:
  - all
file_path_prefix:
- chat_title
- media_datetime
media_types:
- audio
- photo
- video
- document
- voice
- video_note
# in linux please use /
save_path: /tmp/tdl_test_downloads
language: EN
hide_file_name: false
proxy:
  scheme: socks5
  hostname: 127.0.0.1
  port: 7890
# file_name_prefix supports: message_id, file_name, caption, media_datetime
# media_datetime adds "YYYY-MM-DD HHmmss" format timestamp from the Telegram upload time
file_name_prefix:
- media_datetime
- message_id
- file_name
- caption
file_name_prefix_split: ' - '
